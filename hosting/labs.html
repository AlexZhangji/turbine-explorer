  <script>
  (function(){
    function apply(lang){
      lang=lang==='zh'?'zh':'en';document.body.className='lang-'+lang;document.documentElement.lang=lang==='zh'?'zh-CN':'en';
      document.querySelectorAll('button[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
      document.querySelectorAll('a[data-follow-language]').forEach(a=>{const u=new URL(a.href);u.searchParams.set('lang',lang);a.href=u.href;});
      const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);
      try{localStorage.setItem('turbine-language',lang)}catch(e){}
    }
    let stored='en';try{stored=localStorage.getItem('turbine-language')||'en'}catch(e){}
    apply(new URLSearchParams(location.search).get('lang')||stored);
    document.querySelectorAll('button[data-lang]').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.lang)));
  })();
  </script>
</body>
